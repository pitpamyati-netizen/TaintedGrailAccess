input.help.text=Arrows navigate the section. Tab and Shift Tab change section. Enter selects or plays a card. Space reads details without playing. Backspace opens card or class deck inspection. Escape cancels targeting or closes inspection. In combat: Ctrl H reads health; Ctrl Y energy; Ctrl R class resource; Ctrl B barrier and block; Ctrl P hero effects; Ctrl I detailed enemy intents; Alt I brief intents; Alt H the hand. These use physical Latin letter keys even with a different keyboard layout. Readouts keep the selected card. After a card is played, focus stays in the hand; an empty hand returns to end turn. End turn is in the actions section. For multiple selections, Enter changes the mark; then choose Confirm. Mandatory selections cannot be cancelled. The game receives input during key binding and text entry. Escape closes this help.
