text.editing=Ввод текста. Контрол и F1 читают текст или выделение. Контрол и Enter завершают редактирование. Escape выполняет отмену самой игры.
text.description=Описание
input.help.text=Стрелки перемещают по разделу. Tab и Shift Tab меняют раздел. Enter выбирает или разыгрывает карту. Space читает подробности без розыгрыша. Backspace открывает просмотр карты или классовой колоды. Escape отменяет выбор цели или закрывает просмотр. В бою: Ctrl H — здоровье; Ctrl Y — энергия; Ctrl R — классовый ресурс; Ctrl B — барьер и блокирование; Ctrl P — эффекты героя; Ctrl I — подробные намерения врагов; Alt I — краткие намерения; Alt H — обзор руки. Используются физические клавиши латинских букв, в том числе при русской раскладке. Эти команды не меняют выбранную карту. После её розыгрыша фокус остаётся в руке, при пустой руке переходит к концу хода. Для конца хода перейдите в раздел действий. В выборе нескольких карт Enter меняет отметку; после нужного количества выберите Подтвердить. Обязательный выбор нельзя отменить. Во время назначения клавиши и ввода текста управление получает игра. Escape закрывает эту справку.
input.help.close=Закрыть справку
